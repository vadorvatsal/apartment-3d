<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#f4f1ec}*{box-sizing:border-box}a{color:#a4532f}a:hover{color:#7d3d20}button{font:inherit}</style>
</helmet>
<div style="display:flex;flex-wrap:wrap;min-height:100vh;font-family:'Instrument Sans','Noto Sans Devanagari',system-ui,sans-serif;color:#2b2724;background:#f4f1ec">
  <aside style="flex:1 1 300px;max-width:380px;padding:28px 22px;display:flex;flex-direction:column;gap:22px;border-right:1px solid #e4ded4;background:#faf8f4">
    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;color:#8a8178">SWASTIK HEIGHTS · 3RD FLOOR</div>
      <h1 style="margin:0;font-size:32px;line-height:1.1;font-weight:600;letter-spacing:-.01em">{{ t.title }}</h1>
      <p style="margin:0;font-size:15px;line-height:1.5;color:#5d564f;text-wrap:pretty">{{ t.sub }}</p>
    </div>
    <button onClick="{{ startTour }}" style="padding:14px 16px;border:0;border-radius:10px;background:#a4532f;color:#fff;font-size:16px;font-weight:600;cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center" style-hover="background:#8e4526">{{ t.tour }}<span style="font-size:18px">→</span></button>
    <div style="display:flex;flex-direction:column;gap:8px">
      <span style="font-size:13px;font-weight:600;color:#8a8178;letter-spacing:.04em;padding:0 4px">{{ t.layouts }}</span>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        <sc-for list="{{ layoutOpts }}" as="o" hint-placeholder-count="1">
          <button onClick="{{ o.onClick }}" style="border:1px solid {{ o.bd }};border-radius:8px;padding:8px 14px;font-size:14px;font-weight:500;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }}">{{ o.label }}</button>
        </sc-for>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 4px">
        <span style="font-size:13px;font-weight:600;color:#8a8178;letter-spacing:.04em">{{ t.rooms }}</span>
        <button onClick="{{ goWhole }}" style="border:0;background:none;padding:0;font-size:13px;color:#a4532f;cursor:pointer;font-weight:500">{{ t.whole }}</button>
      </div>
      <sc-for list="{{ rooms }}" as="r" hint-placeholder-count="14">
        <button onClick="{{ r.onClick }}" style="display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:{{ r.bg }};color:{{ r.fg }};cursor:pointer;text-align:left">
          <span style="display:flex;gap:10px;align-items:center;min-width:0">
            <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:{{ r.subc }}">{{ r.num }}</span>
            <span style="font-size:15px;font-weight:500">{{ r.name }}</span>
          </span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:{{ r.subc }};white-space:nowrap">{{ r.dims }}</span>
        </button>
      </sc-for>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
        <span style="font-size:14px;color:#5d564f">{{ t.furniture }}</span>
        <div style="display:flex;gap:4px;padding:3px;background:#ece6dc;border-radius:8px">
          <sc-for list="{{ furnOpts }}" as="o" hint-placeholder-count="2">
            <button onClick="{{ o.onClick }}" style="border:0;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }}">{{ o.label }}</button>
          </sc-for>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
        <span style="font-size:14px;color:#5d564f">{{ t.walls }}</span>
        <div style="display:flex;gap:4px;padding:3px;background:#ece6dc;border-radius:8px">
          <sc-for list="{{ wallOpts }}" as="o" hint-placeholder-count="2">
            <button onClick="{{ o.onClick }}" style="border:0;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }}">{{ o.label }}</button>
          </sc-for>
        </div>
      </div>
    </div>
    <p style="margin:auto 0 0;font-size:12px;line-height:1.5;color:#8a8178;text-wrap:pretty">{{ t.note }}</p>
  </aside>
  <main style="flex:999 1 520px;position:sticky;top:0;height:100vh;min-height:520px;overflow:hidden;background:#ece7df">
    <div ref="{{ mountRef }}" style="position:absolute;inset:0;cursor:grab"></div>
    <div ref="{{ labelRef }}" style="position:absolute;inset:0;pointer-events:none;overflow:hidden"></div>
    <div style="position:absolute;top:16px;right:16px;display:flex;gap:4px;padding:4px;background:rgba(250,248,244,.94);border-radius:10px;box-shadow:0 2px 10px rgba(60,45,30,.12)">
      <sc-for list="{{ viewOpts }}" as="o" hint-placeholder-count="2">
        <button onClick="{{ o.onClick }}" style="border:0;border-radius:7px;padding:9px 14px;font-size:14px;font-weight:500;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }}">{{ o.label }}</button>
      </sc-for>
    </div>
    <sc-if value="{{ hasSel }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:16px;bottom:16px;width:min(400px,calc(100% - 32px));background:#fffdf9;border-radius:14px;padding:18px 20px;box-shadow:0 8px 30px rgba(60,45,30,.18);display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:#8a8178">
          <span>{{ selNum }}</span>
          <span>{{ selDims }} · ≈ {{ selArea }} {{ t.area }}</span>
        </div>
        <div style="font-size:24px;font-weight:600;line-height:1.15">{{ selName }}</div>
        <p style="margin:0;font-size:15px;line-height:1.5;color:#4a443e;text-wrap:pretty">{{ selDesc }}</p>
        <div style="display:flex;gap:8px;margin-top:4px;flex-wrap:wrap">
          <button onClick="{{ prev }}" style="flex:1;padding:10px 12px;border:1px solid #ddd5c9;border-radius:8px;background:#fff;color:#2b2724;font-size:14px;cursor:pointer" style-hover="background:#f4efe7">← {{ t.prev }}</button>
          <button onClick="{{ next }}" style="flex:1;padding:10px 12px;border:0;border-radius:8px;background:#2b2724;color:#fff;font-size:14px;font-weight:500;cursor:pointer" style-hover="background:#45403b">{{ t.next }} →</button>
        </div>
      </div>
    </sc-if>
    <div style="position:absolute;right:16px;bottom:16px;font-size:12px;color:#6f675f;background:rgba(250,248,244,.85);padding:6px 10px;border-radius:6px">{{ hint }}</div>
    <sc-if value="{{ loading }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:#6f675f">{{ t.loading }}</div>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;language&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;English&quot;,&quot;Hindi&quot;],&quot;default&quot;:&quot;English&quot;,&quot;tsType&quot;:&quot;'English'|'Hindi'&quot;},&quot;autoRotate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { sel: null, view: 'above', furniture: true, walls: 'low', ready: false, layout: (() => {
    try { const m = location.hash.match(/layout=([\w-]+)/); const id = (m && m[1]) || localStorage.getItem('home3d.layout'); if (id && Component.LAYOUTS.some(l => l.id === id)) return id; } catch (e) {}
    return Component.LAYOUTS[0].id;
  })() };
  mountRef = React.createRef();
  labelRef = React.createRef();

  static TXT = {

    hi: { title: 'हमारा नया घर', sub: 'स्वस्तिक हाइट्स, तीसरी मंज़िल का फ़्लैट। किसी भी कमरे पर टैप करके अंदर देखें, या टूर शुरू करें।', tour: 'कमरा-दर-कमरा टूर शुरू करें', rooms: 'कमरे', layouts: 'लेआउट', whole: 'पूरा घर', furniture: 'फर्नीचर', walls: 'दीवारें', show: 'दिखाएँ', hide: 'छिपाएँ', low: 'नीची', full: 'पूरी', v3d: '3D दृश्य', vtop: 'ऊपर से', vabove: 'ऊपर से देखें', veye: 'अंदर खड़े होकर', prev: 'पिछला', next: 'अगला', hint: 'घुमाने के लिए खींचें · ज़ूम के लिए स्क्रॉल · कमरे पर टैप करें', hintEye: 'चारों ओर देखने के लिए खींचें', note: 'फर्नीचर केवल अंदाज़े के लिए है। कमरों के माप आर्किटेक्ट के तीसरी मंज़िल के नक्शे (AMRD, फ़रवरी 2026) से लिए गए हैं; 3D लगभग है।', loading: '3D घर बन रहा है…', area: 'वर्ग फ़ुट' }
  };

  static ROOMS = [

    { id: 'kitchen', en: 'Kitchen & dining', hi: 'रसोई और डाइनिंग', dims: "15'8\" × 11'", area: 173, floor: 'stone', rects: [[36.75, .5, 55, 11.5]], eye: [38.5, 10.8], look: [52, 2],
      dEn: 'Sage-green shaker cabinets with gold handles, a white quartz counter and a patterned tile backsplash. Black built-in ovens, a large round white table for five with soft mint chairs, set between the kitchen and living room, and a gold bubble chandelier above.', dHi: 'सुनहरे हैंडल वाली सेज-हरी कैबिनेट, सफ़ेद क्वार्ट्ज़ काउंटर और डिज़ाइन वाली टाइल्स। काले बिल्ट-इन ओवन, रसोई और लिविंग रूम के बीच, पाँच लोगों के लिए मुलायम मिंट कुर्सियों वाली बड़ी गोल सफ़ेद मेज़, और ऊपर सुनहरा झूमर।' },
    { id: 'wash', en: 'Wash area', hi: 'वॉश एरिया', dims: "5' × 7'5\"", area: 37, floor: 'bath', rects: [[27.25, .5, 32.25, 8]], eye: [29.75, 7.7], look: [29.75, 1],

      dEn: 'Shared toilet near the entrance. Walk-in shower with powder-blue subway tiles, white marble up to waist height, a marble bench and an arched niche. Hex mosaic floor and brushed-gold fittings.', dHi: 'प्रवेश के पास साझा टॉयलेट। पाउडर-ब्लू सबवे टाइल्स वाला शावर, कमर तक सफ़ेद मार्बल, मार्बल की बेंच और मेहराबदार आला। हेक्सागन मोज़ेक फ़र्श और सुनहरी फिटिंग्स।' },
    { id: 'bed', en: 'Bedroom', hi: 'बेडरूम', dims: "12'9\" × 11'", area: 140, floor: 'wood', rects: [[2.5, .5, 15.25, 11.5]], eye: [14.6, 10.7], look: [5, 3],

    { id: 'mbed3', en: 'Master bedroom 3', hi: 'मास्टर बेडरूम 3', dims: "12'9\" × 15'11\"", area: 203, floor: 'wood', rects: [[2.5, 12, 15.25, 28]], eye: [14.4, 13.4], look: [5, 25],
      dEn: 'A large bedroom with its own attached toilet, and sliding doors to flower beds on two sides.', dHi: 'अपने अटैच्ड टॉयलेट वाला बड़ा बेडरूम, और दो तरफ़ फूलों की क्यारियों की ओर स्लाइडिंग दरवाज़े।' },
    { id: 'atoiletW', en: 'Toilet (Master 3)', hi: 'टॉयलेट (मास्टर 3)', dims: "5'6\" × 11'", area: 61, floor: 'bGreen', rects: [[15.75, 16, 21.25, 26.5]], eye: [16.3, 18.4], look: [20, 25.5],

    { id: 'balcony', en: 'Balcony', hi: 'बालकनी', dims: "27'2\" × 5'1\"", area: 138, floor: 'terrazzo', rects: [[21.75, 26, 49, 31]], eye: [31, 28.2], look: [22, 28.6], focus: [27, 28.5],
      dEn: 'A 5-foot-deep balcony along the living room. Terrazzo floor, a dark wooden slat wall with a cushioned bench and plant shelves, a black wire chair and side table, and a long planter with trailing flowers along the black railing.', dHi: 'लिविंग रूम के साथ 5 फ़ुट गहरी बालकनी। टेराज़ो फ़र्श, गद्देदार बेंच और पौधों की शेल्फ़ वाली गहरी लकड़ी की दीवार, काली तारों वाली कुर्सी और छोटी मेज़, और काली रेलिंग के साथ लटकते फूलों वाला लंबा प्लांटर।' },

      dEn: 'Mirror of Master bedroom 3 on the other side — attached toilet and sliding doors to flower beds.', dHi: 'दूसरी तरफ़ मास्टर बेडरूम 3 जैसा ही — अटैच्ड टॉयलेट और फूलों की क्यारियों की ओर स्लाइडिंग दरवाज़े।' },
    { id: 'atoiletE', en: 'Toilet (Master 2)', hi: 'टॉयलेट (मास्टर 2)', dims: "5'6\" × 11'", area: 61, floor: 'bStar', rects: [[49.5, 16, 55, 26.5]], eye: [54.45, 18.4], look: [50.75, 25.5],
      dEn: 'Attached toilet for Master bedroom 2. Sky-blue shower tiles, warm beige walls, an oak floating vanity with a round gold mirror and wall lamps, a wall-hung WC with a lit shelf niche above, and a gold towel warmer.', dHi: 'मास्टर बेडरूम 2 का अटैच्ड टॉयलेट। आसमानी-नीली शावर टाइल्स, हल्की बेज दीवारें, गोल सुनहरे शीशे और दीवार लैंप के साथ ओक की फ़्लोटिंग वैनिटी, ऊपर रोशन शेल्फ़ वाला दीवार पर लगा WC, और सुनहरा तौलिया रेल।' },
    { id: 'mbed1', en: 'Master bedroom 1', hi: 'मास्टर बेडरूम 1', dims: "12'9\" × 11'", area: 140, floor: 'wood', rects: [[55.5, .5, 68.25, 11.5]], eye: [56.15, 10.7], look: [65.75, 3],
      dEn: 'Bedroom next to the dining area, with a sliding glass door onto a flower bed.', dHi: 'डाइनिंग के पास का बेडरूम, फूलों की क्यारी की ओर काँच के स्लाइडिंग दरवाज़े के साथ।' },
    { id: 'garden', en: 'Flower beds', hi: 'फूलों की क्यारियाँ', dims: "2'–2'6\" wide", area: 0, floor: 'soil', label: [9, 29.8], rects: [[0, .5, 2, 28], [2.5, 28.5, 15.25, 31], [55.5, 28.5, 68.25, 31], [68.75, .5, 70.75, 28]], eye: [14.6, 30.2], look: [1, 29],
      dEn: 'Narrow planters wrap around the bedrooms, so every bedroom door looks out onto greenery.', dHi: 'संकरी क्यारियाँ बेडरूमों के चारों ओर हैं, ताकि हर बेडरूम के दरवाज़े से हरियाली दिखे।' }
  ];

  live() { return window.__home3dLive || this; }
  S() { return this.live().state; }
  P() { return this.live().props; }
  lang() { return (this.P().language ?? 'English') === 'Hindi' ? 'hi' : 'en'; }
  t() { return Component.TXT[this.lang()]; }

    const seg = (on) => ({ bg: on ? '#2b2724' : 'transparent', fg: on ? '#fff' : '#5d564f' });
    const viewOpts = sel
      ? [{ label: t.vabove, ...seg(view !== 'eye'), onClick: () => this.setState({ view: 'above' }) }, { label: t.veye, ...seg(view === 'eye'), onClick: () => this.setState({ view: 'eye' }) }]
      : [{ label: t.v3d, ...seg(view !== 'top'), onClick: () => this.setState({ view: 'above' }) }, { label: t.vtop, ...seg(view === 'top'), onClick: () => this.setState({ view: 'top' }) }];
    return {
      t, loading: !ready, mountRef: this.mountRef, labelRef: this.labelRef,
      rooms: R.map((r, i) => ({
        num: pad(i + 1), name: this.roomName(r, L), dims: r.dims,
        bg: r.id === sel ? '#a4532f' : 'transparent', fg: r.id === sel ? '#fff' : '#2b2724', subc: r.id === sel ? '#f3dccf' : '#958c82',
        onClick: () => this.select(r.id)
      })),
      furnOpts: [{ label: t.show, ...seg(furniture), onClick: () => this.setState({ furniture: true }) }, { label: t.hide, ...seg(!furniture), onClick: () => this.setState({ furniture: false }) }],
      wallOpts: [{ label: t.low, ...seg(walls === 'low'), onClick: () => this.setState({ walls: 'low' }) }, { label: t.full, ...seg(walls === 'full'), onClick: () => this.setState({ walls: 'full' }) }],
      viewOpts,
      layoutOpts: Component.LAYOUTS.map(l => { const on = l.id === this.state.layout; return { label: l[L], bg: on ? '#2b2724' : '#fffdf9', fg: on ? '#fff' : '#2b2724', bd: on ? '#2b2724' : '#ddd5c9', onClick: () => this.setLayout(l.id) }; }),
      startTour: () => this.setState({ sel: R[0].id, view: 'above' }),
      goWhole: () => this.setState({ sel: null, view: 'above' }),
      hasSel: !!room,
      selNum: room ? `${pad(idx + 1)} / ${pad(R.length)}` : '',
      selName: room ? this.roomName(room, L) : '', selDims: room ? room.dims : '', selArea: room ? (room.area || '—') : '',
      selDesc: room ? (() => { const lo = Component.LAYOUTS.find(l => l.id === this.state.layout); const ov = lo && lo.desc && lo.desc[room.id]; return ov ? ov[L] : (L === 'hi' ? room.dHi : room.dEn); })() : '',
      prev: () => this.step(-1), next: () => this.step(1),
      hint: sel && view === 'eye' ? t.hintEye : t.hint
    };
  }
}
</script>
</body>
</html>
